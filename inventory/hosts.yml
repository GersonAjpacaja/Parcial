all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_cli_ssh_type: libssh
    ansible_network_os: cisco.ios.ios
    ansible_user: cisco
    ansible_password: Cisco123
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: Cisco123
  children:
    hubs:
      hosts:
        R1:
          ansible_host: 172.16.0.1
          node_id: 1
        R2:
          ansible_host: 172.16.0.2
          node_id: 2
    spokes:
      hosts:
        R3:
          ansible_host: 172.16.0.3
          node_id: 3
        R4:
          ansible_host: 172.16.0.4
          node_id: 4
        R5:
          ansible_host: 172.16.0.5
          node_id: 5
        R6:
          ansible_host: 172.16.0.6
          node_id: 6
        R7:
          ansible_host: 172.16.0.7
          node_id: 7

    monitoring:
      hosts:
        zabbix_server:
          ansible_host: 172.16.0.25
          ansible_connection: ansible.builtin.httpapi
          ansible_network_os: community.zabbix.zabbix
          ansible_become: false
          ansible_httpapi_port: 80
          ansible_httpapi_use_ssl: false
          ansible_zabbix_url_path: "/zabbix"
          ansible_user: Admin                
          ansible_httpapi_pass: zabbix
